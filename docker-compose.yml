services:
  catalog:
    user: $userID:$groupID
    image: matatika/catalog:42017
    ports:
      - "8080:8080"
      - "8443:8443"
    deploy:
      resources:
        reservations:
          memory: 1g
        limits:
          memory: 3g
    tty: true
    env_file: config/.env
    environment:
      # ==== CATALOG ====
      - ACTIVE_PROFILES=default,distribution
      - "JAVA_OPTS=-XX:MaxDirectMemorySize=1G -XX:MaxMetaspaceSize=240234K -XX:ReservedCodeCacheSize=240M -Xss1M -Xms512m -Xmx1040584K"
      - PERSISTENCE_CATALOG_URL=jdbc:postgresql://db:5432/warehouse
      - PERSISTENCE_CATALOG_USERNAME=warehouse
      - PERSISTENCE_CATALOG_PASSWORD=warehouse
      - PERSISTENCE_CATALOG_DRIVER_CLASS_NAME=org.postgresql.Driver
      - MATATIKA_ELASTICSEARCH_ENABLED=false
      - MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=false
      - MATATIKA_WORKSPACES_HOME=/workspaces
      - MATATIKA_PLUGINS_HOME=/plugins,/plugins-staging,file:/local-plugins
      # HTTPS config - generate a keystore in config/certs
      # - SERVER_PORT=8443
      # - SERVER_SSL_ENABLED=true
      # - SERVER_SSL_KEY_STORE=/certs/keystore.p12
      # - SERVER_SSL_KEY_STORE_PASSWORD=password
      # - SERVER_SSL_KEY_STORE_TYPE=pkcs12
      # - SERVER_SSL_KEY_ALIAS=springboot
      # - SERVER_SSL_KEY_PASSWORD=  # leave commented out for no password

      # ==== APP ====
      - REACT_APP_ENV=distribution
    depends_on:
      db:
        condition: service_healthy
      ducklake_catalog:
        condition: service_healthy
    healthcheck:
      test: curl -fs http://localhost:8080/actuator/health | grep '^\{"status":"UP"' > /dev/null
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 5
    volumes:
      - certs:/certs
      - workspaces:/workspaces
      - plugins:/local-plugins
      - lake:/lake

  db:
    image: postgres:15
    volumes:
      - matatika-catalog_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_USER: warehouse
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U warehouse
      interval: 10s
      timeout: 5s
      retries: 5

  dazzleduck:
    image: dazzleduck/dazzleduck:latest
    container_name: dazzleduck
    ports:
      - "8081:8081"
      - "59307:59307"
    working_dir: /workspace
    volumes:
      - dazzleduck_data:/workspace/warehouse
      - ./scripts:/startup:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /workspace/warehouse/metadata/ducklake_catalog /workspace/warehouse/data/ducklake_catalog/main && \
        exec /app/entrypoint.sh "$$@"
    command:
      - "--conf"
      - "dazzleduck_server.startup_script_provider.class=io.dazzleduck.sql.flight.LocalStartupConfigProvider"
      - "--conf"
      - "dazzleduck_server.startup_script_provider.script_location=/startup/ducklake-init.sql"
      - "--conf"
      - "users.0.username=admin"
      - "--conf"
      - "users.0.password=admin"
    depends_on:
      ducklake_catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ducklake_catalog:
    image: postgres:15
    container_name: ducklake_catalog
    volumes:
      - ducklake_catalog_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ducklake_catalog
      POSTGRES_USER: ducklake_user
      POSTGRES_PASSWORD: ducklake_password
    expose:
      - "5733"
    ports:
      - "5733:5432"
    healthcheck:
      test: pg_isready -U ducklake_user -d ducklake_catalog
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matatika-catalog_postgres:
  certs:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/config/certs
      o: bind
  workspaces:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/workspaces
      o: bind
  plugins:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/plugins
      o: bind
  lake:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/lake
      o: bind
  dazzleduck_data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dazzleduck_data
      o: bind
  ducklake_catalog_data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/ducklake_catalog_data
      o: bind

networks:
  default:
    name: matatika
