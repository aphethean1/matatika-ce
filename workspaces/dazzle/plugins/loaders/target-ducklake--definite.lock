{
  "plugin_type": "loaders",
  "name": "target-ducklake",
  "namespace": "ducklake",
  "variant": "definite",
  "label": "Ducklake",
  "repo": "https://github.com/definite-app/target-ducklake",
  "pip_url": "git+https://github.com/definite-app/target-ducklake@main",
  "executable": "target-ducklake",
  "description": "Ducklake is a Singer target that supports multiple storage backends and catalog databases.\n\nTarget-ducklake is a Singer target for Ducklake that supports multiple storage backends (GCS, S3, local) and catalog databases (Postgres, SQLite, MySQL, DuckDB). It provides a flexible and scalable solution for data warehousing with support for various loading strategies including append, merge, and overwrite. Ducklake's architecture allows users to store data in cost-effective object storage while maintaining a catalog database for metadata and query optimization.\n### Prerequisites\nTo obtain the required settings for connecting to Ducklake:\n\n1. Catalog URL: Connection string to your catalog database (Postgres, SQLite, MySQL, or DuckDB).\n\n2. Data Path: GCS bucket path, S3 bucket path, or local folder path for data storage.\n\n3. Storage Type: Specify the backend storage type (GCS, S3, or local).\n\n4. Catalog Type: Database type for your catalog (postgres, sqlite, mysql, or duckdb).\n\n5. Credentials: For GCS or S3 storage, you'll need public_key and secret_key for authentication.\n\n6. Region: For S3 storage, specify the AWS region.",
  "logo_url": "/assets/logos/loaders/duckdb.png",
  "capabilities": [
    "about",
    "stream-maps",
    "schema-flattening"
  ],
  "settings": [
