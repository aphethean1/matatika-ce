settings:
- name: catalog_url
  label: Catalog URL
  description: URL connection string to your catalog database.
  value: $MELTANO_STATE_BACKEND_URI
- name: data_path
  label: Data Path
  description: GCS, S3, or local folder path for data storage.
  kind: string
  required: true
  placeholder: /lake/[your lake name]
- name: storage_type
  label: Storage Type
  description: Specifies backend storage type.
  kind: options
  options:
  - label: Local
    value: local
  - label: GCS
    value: GCS
  - label: S3
    value: S3
  value: local
- name: catalog_type
  label: Catalog Type
  description: Database type for catalog.
  kind: options
  options:
  - label: Postgres
    value: postgres
  - label: SQLite
    value: sqlite
  - label: MySQL
    value: mysql
  - label: DuckDB
    value: duckdb
  value: postgres
- name: public_key
  label: Public Key
  description: Credentials for private GCS/S3 storage.
  kind: string
  sensitive: true
- name: secret_key
  label: Secret Key
  description: Credentials for private GCS/S3 storage.
  kind: string
  sensitive: true
- name: region
  label: Region
  description: AWS region for S3 operations.
  kind: string
- name: meta_schema
  label: Meta Schema
  description: Schema for Ducklake metadata tables.
  kind: string
  required: true
  value: metadata
- name: default_target_schema
  label: Default Target Schema
  description: Default schema for data writes.
  kind: string
  required: true
- name: target_schema_prefix
  label: Target Schema Prefix
  description: Prefix for schema names.
  kind: string
- name: load_method
  label: Load Method
  description: Loading strategy—append, merge, or overwrite.
  kind: options
  options:
  - label: Append
    value: append
  - label: Merge
    value: merge
  - label: Overwrite
    value: overwrite
  value: merge
- name: add_record_metadata
  label: Add Record Metadata
  description: Automatically adds Singer Data Capture metadata columns.
  kind: boolean
  value: false
- name: overwrite_if_no_pk
  label: Overwrite If No Primary Key
  description: Truncates tables when primary keys are absent.
  kind: boolean
  value: false
- name: max_batch_size
  label: Max Batch Size
  description: Maximum number of records to process in a single batch.
  kind: integer
  value: 10000
- name: temp_file_dir
  label: Temp File Directory
  description: Location for temporary parquet files.
  kind: string
  value: temp_files/
- name: flatten_max_level
  label: Flatten Max Level
  description: Nesting depth for field flattening (0 to disable).
  kind: integer
  value: 0
- name: auto_cast_timestamps
  label: Auto Cast Timestamps
  description: Converts timestamp-like fields to timestamp types.
  kind: boolean
  value: false
- name: convert_tz_to_utc
  label: Convert Timezone to UTC
  description: Normalizes timezone data to UTC.
  kind: boolean
  value: false
- name: validate_records
  label: Validate Records
  description: Schema validation for incoming streams.
  kind: boolean
  value: false
- name: partition_fields
  label: Partition Fields
  description: Maps stream names to partition column definitions with type (timestamp/identifier) and granularity options.
  kind: object
- description: Config object for stream maps capability. For more information check
    out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
- description: User-defined config values to be used within map expressions.
  kind: object
  label: Stream Map Config
