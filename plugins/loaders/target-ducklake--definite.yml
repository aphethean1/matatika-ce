description: >-
  Ducklake is a Singer target that supports multiple storage backends and catalog databases.


  Target-ducklake is a Singer target for Ducklake that supports multiple storage backends
  (GCS, S3, local) and catalog databases (Postgres, SQLite, MySQL, DuckDB). It provides a
  flexible and scalable solution for data warehousing with support for various loading
  strategies including append, merge, and overwrite. Ducklake's architecture allows users
  to store data in cost-effective object storage while maintaining a catalog database for
  metadata and query optimization.

  ### Prerequisites

  To obtain the required settings for connecting to Ducklake:


  1. Catalog URL: Connection string to your catalog database (Postgres, SQLite, MySQL, or DuckDB).


  2. Data Path: GCS bucket path, S3 bucket path, or local folder path for data storage.


  3. Storage Type: Specify the backend storage type (GCS, S3, or local).


  4. Catalog Type: Database type for your catalog (postgres, sqlite, mysql, or duckdb).


  5. Credentials: For GCS or S3 storage, you'll need public_key and secret_key for authentication.


  6. Region: For S3 storage, specify the AWS region.
