settings_preamble: |
  ### Ducklake Target Setup

  Target-ducklake supports multiple storage backends and catalog databases, providing flexibility in how you store and manage your data.

  **Storage Backends:**
  - Local filesystem
  - Google Cloud Storage (GCS)
  - Amazon S3

  **Catalog Databases:**
  - PostgreSQL
  - SQLite
  - MySQL
  - DuckDB

  **Environment Configuration:**
  The target supports loading configuration from environment variables via a `.env` file when invoked with `--config=ENV`.

  For more information, visit the [target-ducklake repository](https://github.com/definite-app/target-ducklake).
